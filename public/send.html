<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Send Otp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">
    <h1>Send Otp</h1>

    <!-- this is not a login screen, it just takes an email and sends an otp to it -->

    <button id="sendBtn">Send Otp</button>
    <button id="resendBtn">Resend Otp</button>

    <p id="message"></p>

    <a href="verify.html">Go to verify screen</a>
  </div>

  <script src="send.js"></script>
</body>
</html>
